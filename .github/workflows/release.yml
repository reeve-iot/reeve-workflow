name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read
  id-token: write

jobs:
  nuget:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build dotnet/ReeveWorkflow.slnx -c Release /p:Version=$VERSION
      - run: dotnet test dotnet/ReeveWorkflow.slnx -c Release --no-build --filter "Category!=Docker" -m:1
      - run: dotnet pack dotnet/ReeveWorkflow.slnx -c Release -o artifacts/nupkg /p:Version=$VERSION /p:ContinuousIntegrationBuild=true
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: node tools/release/set-version.mjs "$VERSION"
      - run: npx tsc -b
      - run: npx vitest run --reporter=dot tools/grammar/release.test.ts
      - run: npx vitest run --reporter=dot
      - run: |
          case "$VERSION" in
            *-*) NPM_TAG=next ;;
            *) NPM_TAG=latest ;;
          esac
          for ws in core mui client adapters; do
            if [ -n "$(npm view "@reeve-iot/workflow-$ws@$VERSION" version 2>/dev/null)" ]; then
              echo "@reeve-iot/workflow-$ws@$VERSION is already on npm."
              continue
            fi
            npm publish --workspace "@reeve-iot/workflow-$ws" --tag "$NPM_TAG" --provenance --access public
          done

  github-release:
    needs: [npm, nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1) { found = 1; next } }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) PRERELEASE=--prerelease ;;
            *) PRERELEASE= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag $PRERELEASE
